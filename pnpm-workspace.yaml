# Third-party packages must be at least this old before install will take them.
# It is a supply-chain control: a malicious version published an hour ago is the
# shape most registry attacks take, and none of them survive a week.
minimumReleaseAge: 10080

# @cloudsforge/* are first-party and are exempt — waiting a week to consume our
# own release would make the polyrepo unworkable. See docs/ecosystem/02 AD-02.
minimumReleaseAgeExclude:
  - '@cloudsforge/*'

# Omitting this makes install rewrite the file with placeholders.
allowBuilds:
  # Optional native accelerators for `ws`, reached through @solana/web3.js's websocket
  # subscription client. **This service never opens one**: every chain call goes through the
  # `JsonRpc` port in chains.ts, which is HTTP, and that port is also what makes the suite unable
  # to reach a real network. So there is nothing here to accelerate, and a native build step in the
  # image of the service that signs withdrawals is surface bought for no benefit.
  bufferutil: false
  esbuild: false
  utf-8-validate: false
strictDepBuilds: false
