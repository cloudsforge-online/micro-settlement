name: CI

# ────────────────────────────────────────────────────────────────────────────────────────────────
# The estate-wide half of this file is a CALL, not a copy. The 260 lines it replaces said so
# themselves: "THIS FILE IS TEMPORARY … deleted and replaced by a call to the shared reusable
# workflow". That workflow exists, so this is that deletion.
#
# WHAT THE COPY COST WHILE IT SURVIVED. service-ci.yml runs a step no bespoke file had: it derives
# every scope this service's route gates demand and fails if one is absent from the registry in
# @cloudsforge/contracts-auth. identity refuses to mint a token naming an unknown scope, so an
# unregistered scope is a service-to-service surface no identity-issued token can ever reach — and
# the suite stays green regardless, because it mints its own principals. settlement:read and
# settlement:register have been gating routes here with nothing checking either.
#
# The shared workflow also brings an image job that MIGRATES AND BOOTS the container and reads
# /livez. The old `docker` job stopped at `push: false` — it built the image and never once ran it,
# which for a service that signs withdrawals is the difference between "the Dockerfile parses" and
# "the thing we deploy starts".
#
# The `controls` job below is what the shared workflow does not cover: rule 7, this repository's
# stricter reading of rule 8, and the invariants this service exists to hold. Every one is asserted
# as TEXT — the tests prove they work, these prove they are still there.
# ────────────────────────────────────────────────────────────────────────────────────────────────

on:
  push:
    # `release/**` builds too. A release branch carries the estate-wide version bump, and it
    # has to publish its images before testnet can be deployed from it — which is what proves
    # the release before anything is merged. Mainnet is unaffected: it pins a version tag.
    # `feat/**` builds too, for the same reason `release/**` does: a change that has to be proved
    # on testnet before it merges needs a published image to deploy, and the estate deploys images
    # rather than source. Mainnet is unaffected — it pins a version tag.
    # `fix/**` builds for exactly the same reason, and the omission was an accident of naming
    # rather than a policy: a fix is the change most likely to need proving on a live estate
    # before it merges, because it is the one written in response to something that already broke.
    branches: [main, 'release/**', 'feat/**', 'fix/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  estate:
    uses: cloudsforge-online/micro-org/.github/workflows/service-ci.yml@main
    with:
      service: settlement
      database-env-var: SETTLEMENT_DATABASE_URL
      port: 4000
      # Match production rather than the workflow's default of 16: the estate's compose files pin
      # postgres:17-alpine, and a suite that passes on a version nobody runs proves nothing.
      postgres-version: '17'
      # The image smoke test boots the real service, and src/env.ts validates its configuration at
      # import — so the container needs the variables it declares, not just a database, or it exits
      # before it can serve /livez. The upstream URLs are never dialled, because /livez makes no
      # outbound call.
      #
      # THE SENTENCE THAT USED TO BE HERE — "the two secrets only have to clear a length check" —
      # WAS THE DEFECT STATED OUT LOUD IN CONFIGURATION. A length check is what let micro-org
      # #142's 40-character `estate-only-outbox-secret-…` onto 44 containers on both networks.
      # `src/env.ts` now runs `@cloudsforge/secrets`, which checks the SHAPE of a generated value —
      # base64 or hex, 32 decoded BYTES, an entropy floor — and has no CI exemption on purpose,
      # because an escape hatch is reached for in exactly the hurry that produced the defect. The
      # literal that used to sit below normalises to a string containing `cionly` and `notareal`,
      # so it is refused twice over.
      #
      # The answer is not a weaker guard. CI does not need a WEAK secret, it needs A secret —
      # nothing in the smoke test verifies a signature against anything else — so the shared
      # workflow expands `=@generate` into a fresh `openssl rand -base64 48` per run and throws it
      # away (micro-org `service-ci.yml`, the `env_args` loop).
      smoke-env: |
        IDENTITY_JWKS_URL=http://127.0.0.1:4001/.well-known/jwks.json
        IDENTITY_ISSUER=http://127.0.0.1:4001
        OUTBOX_SIGNING_SECRET=@generate
        CUSTODY_URL=http://127.0.0.1:4005
        INDEXER_URL=http://127.0.0.1:4006
        LEDGER_URL=http://127.0.0.1:4004
        # `SETTLEMENT_SERVICE_TOKEN` IS DELIBERATELY ABSENT NOW, AND SO IS
        # `SETTLEMENT_IDENTITY_CREDENTIAL`.
        #
        # It used to be `ci-only-not-a-real-token-0000000000000`, which has no `cfsc_` prefix — so
        # `env.ts` reads it as the RETIRED ten-minute token: reported at boot, presented to nobody,
        # conferring nothing. Supplying it made every smoke run assert that a retired variable was
        # configured, and a variable nothing obeys is a value nothing needed.
        #
        # There is no `@generate` form for a `cfsc_` credential, because identity mints those
        # against a row and a random string with the prefix glued on is a lie the guard exists to
        # catch. Nor
        # is one wanted here: absence is the SUPPORTED mode and it is the one worth smoking —
        # `env.ts` returns `null`, `index.ts` logs that no credential is configured, `/readyz` (not
        # `/livez`) is where the absence is enforced as a hard probe, and the image boots. That
        # last property is the entire reason `env.ts` gives up requiring a credential, so this job
        # is what proves it still holds.
    secrets:
      # @cloudsforge/* resolves through link:../runtime and link:../contracts rather than a
      # registry, so the workflow checks out micro-runtime and micro-contracts as siblings. Both are
      # private, so it needs a contents:read token.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: read

  controls:
    name: The controls this service exists to add
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 'Rule 7 — migrations are never run by the service process'
        run: |
          if grep -nE '\bmigrate\(' src/index.ts; then
            echo '::error::index.ts calls migrate — that is the migrator job, not the service'
            exit 1
          fi
          echo 'ok: the service process does not migrate'

      - name: 'Rule 8 — every background timer is a leased job'
        # The shared workflow bans setInterval. This repository bans setTimeout with it: the chain
        # tick is a leased job keyed on the contended resource, never a timer.
        run: |
          if grep -rnE '\bset(Interval|Timeout)\(' src/ --include='*.ts'; then
            echo '::error::a timer was found; background work is a leased job (@cloudsforge/jobs)'
            exit 1
          fi
          echo 'ok: no timers'

      # ────────────────────────────────────────────────────────────────────────────────────────
      # THE INVARIANT, AS A BUILD CHECK.
      #
      # One in-flight outbound transaction per (chain, network), enforced by the partial unique
      # index and by the lease keyed on `chain:network`. Both halves are checked, because losing
      # either is the lost-payment race coming back: without the index a lease failure signs twice,
      # and without the lease every tick relies on a 23505 to notice.
      # ────────────────────────────────────────────────────────────────────────────────────────
      - name: 'AD — the in-flight index exists and covers exactly the in-flight states'
        run: |
          grep -q 'outbound_in_flight_uniq' src/migrations.ts \
            || { echo '::error::the in-flight unique index is gone from the schema'; exit 1; }
          grep -A3 'create unique index if not exists outbound_in_flight_uniq' src/migrations.ts \
            | grep -q "where state in ('building','signed','broadcast')" \
            || { echo '::error::the in-flight index predicate changed'; exit 1; }

      - name: 'AD — the chain lease is keyed on chain:network, never on a row id'
        run: |
          grep -qF '${chain}:${network}' src/jobs.ts \
            || { echo '::error::the chain job is no longer keyed on chain:network'; exit 1; }
          if grep -nE 'key: .*(outbound|withdrawal|transaction)Id' src/jobs.ts; then
            echo '::error::a job is keyed on a row id; the contended resource is the chain nonce'
            exit 1
          fi

      # A signed transaction may only ever be refunded through the one function that demands a
      # proof, and `markFailed` must stay unable to reach a signed row.
      - name: 'AD — nothing refunds a signed transaction without a proof'
        run: |
          grep -A16 'export async function markFailed' src/outbound.ts \
            | grep -q "state in ('planned','building')" \
            || { echo '::error::markFailed can now reach a signed row'; exit 1; }
          grep -q 'export async function resolveWithProof' src/outbound.ts \
            || { echo '::error::the proof-carrying resolution path is gone'; exit 1; }

      # contracts-chain is exact-pinned by wallet, settlement, custody and indexer. A caret there is
      # a signature bound to the wrong network the first time one of the copies moves.
      - name: 'AD-02 — contracts-chain is never caret-ranged'
        run: |
          if grep -nE '"@cloudsforge/contracts-chain":\s*"\^' package.json; then
            echo '::error::contracts-chain must be exact-pinned, never caret-ranged'
            exit 1
          fi

      # Confirmation depths and decimals are read from contracts-chain and never restated. A second
      # declaration is the skew the exact pin exists to prevent.
      #
      # ZERO is exempt, and only zero: `confirmations: 0` is this service reporting that a chain has
      # not confirmed something yet, which is a measurement rather than a policy. Any other literal
      # is somebody writing a depth down for the second time.
      - name: 'AD — confirmation policy is read, never restated'
        run: |
          if grep -rnE '\b(confirmations|decimals)\s*[:=]\s*[1-9][0-9]*' src/ --include='*.ts' \
             | grep -vE '\.test\.ts|src/testsupport\.ts'; then
            echo '::error::a confirmation depth or decimals literal was declared; read contracts-chain'
            exit 1
          fi

      # ────────────────────────────────────────────────────────────────────────────────────────
      # NO TEST MAY REACH A REAL NETWORK.
      #
      # The local Hearth testnet on 127.0.0.1:8545 may be READ and is never sent to. What actually
      # guarantees it is that every chain call in every test goes through `fakeNode`, an in-memory
      # node — so the check is that no test constructs the real transport. `rpcFactory` is the only
      # thing in this repository that can open a socket to a chain.
      #
      # ONE FILE IS ADMITTED, AND IT IS ADMITTED WITH A CONDITION RATHER THAN WITH TRUST.
      # `src/registry.test.ts` is the suite for that transport — it exists because `rpcFactory`
      # built its client with `baseUrl: parsed.origin`, `URL.origin` discards the userinfo, and
      # every Bitcoin/Litecoin/Dogecoin Core call therefore went out with no `Authorization` header
      # and came back 401. A suite that could not name the function could not have caught that, and
      # a suite that asserts on a stubbed `HttpClient` proves only that it agrees with itself: the
      # defect WAS a disagreement between this repository and the transport underneath it.
      #
      # The condition is `RpcOptions.fetch`. A factory built on an injected fetch has no socket to
      # open, so every line of that file naming `rpcFactory` must be a comment, the import, or a
      # construction that injects one ON THE SAME LINE. Splitting the call across lines fails this
      # on purpose — a per-occurrence check a line break defeats is not a check — and the file says
      # so where the factory is built.
      # ────────────────────────────────────────────────────────────────────────────────────────
      - name: 'AD — no test can reach a real network'
        run: |
          if grep -rn 'rpcFactory' src/*.test.ts | grep -vE '^src/registry\.test\.ts:'; then
            echo '::error::a test builds the real RPC transport; chain calls go through fakeNode'
            exit 1
          fi
          # Comments are stripped first: six guards in this estate have fired on their own prose.
          if grep -n 'rpcFactory' src/registry.test.ts \
             | grep -vE '^[0-9]+:[[:space:]]*(//|\*|/\*)' \
             | grep -vF "from './registry.ts'" \
             | grep -v 'fetch'; then
            echo '::error::registry.test.ts builds a transport without injecting a fetch on that line'
            exit 1
          fi
          if grep -rnE 'https?://' src/*.test.ts | grep -vE '127\.0\.0\.1|localhost|//wallet/|//identity'; then
            echo '::error::a test names a URL that is not local'
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────────────────────────────────────
  # THE IMAGE, PUBLISHED. `cfctl release` writes a manifest naming ghcr.io/cloudsforge-online/<repo>
  # at this repository's package.json version (micro-org tools/cfctl.ts, image name derived
  # at tools/registry.ts); `cfctl release --verify` runs `docker manifest inspect` on every
  # entry (cfctl.ts); and deploy/scripts/release-deploy.sh refuses to change anything
  # until all of them pull. Until this job existed CI built this image and threw it away, so that
  # gate rejected every service in the estate and the manifest path could not be used at all.
  #
  # `packages: write` IS GRANTED HERE rather than asked for inside the shared CI workflow, and that
  # is forced rather than stylistic: a called workflow's GITHUB_TOKEN can only be maintained or
  # reduced, never elevated, so a reusable workflow asking for a permission its caller withheld
  # fails the whole run at STARTUP — before a step runs, on pull requests as well as on main.
  # Measured on micro-org: run 30900277471 (caller capped at `packages: read`) ended in
  # startup_failure; run 30900280323 (same workflow, caller granted `packages: write`) succeeded.
  # That is also why `push: false` is correct and stays in the shared workflow's image job — that
  # job is a GATE and needs `load:` so it can boot the image and read its health endpoint. This is
  # the producer. Different purposes, so different jobs.
  # ──────────────────────────────────────────────────────────────────────────────────────────────
  publish:
    needs: [estate, controls]
    # A green push, and only from a branch something is deployed from. An image tag a release
    # manifest pins has to name something that passed, on the branch it will be deployed from —
    # and a work branch that has to be proved on a live estate before it merges needs the same
    # thing for the same reason, which is why `feat/**` and `fix/**` publish too. Their tags carry
    # the branch name, so nothing a release manifest pins can be reached by them.
    if: >-
      github.event_name == 'push' && (github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/heads/feat/') ||
      startsWith(github.ref, 'refs/heads/fix/'))
    uses: cloudsforge-online/micro-org/.github/workflows/publish-image.yml@main
    with:
      kind: service
    secrets:
      # The same sibling checkouts the Dockerfile's named build contexts need: the image cannot be
      # built without micro-runtime and micro-contracts beside it.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: write
